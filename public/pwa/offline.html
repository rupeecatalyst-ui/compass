<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1f3d" />
    <title>Catalyst One — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: system-ui, sans-serif;
        background: #0f1f3d;
        color: #f8fafc;
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }
      main {
        max-width: 24rem;
        text-align: center;
      }
      h1 { font-size: 1.25rem; }
      p { color: #cbd5e1; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main data-employee-pwa-offline="true">
      <h1>You are offline</h1>
      <p>
        Catalyst One can open this companion shell without a network, but it will not
        save Opportunity, Deal, document, or stage changes until you reconnect.
      </p>
      <p>No mutation is queued while offline.</p>
    </main>
  </body>
</html>
